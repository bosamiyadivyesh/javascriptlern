    <title>Document</title>
    <style>
        .color{
            width:800px;
            height: 700px;
            background-color: papayawhip;
            margin: 0 auto;
            display:flex ;
            overflow:auto;
            padding: 0 auto;
        }
        .coch{
            width:100px;
            height:100px;
            background-color: aqua;
            display: flex;
            margin:20px;
        }
        #yellow{
            background-color: yellow;
        }
        #red{
            background-color:red;

        #blue{

 abcd.forEach(function(divs){
